services:
  server:
    build:
      context: ./server
    environment:
      PORT: ${SERVER_PORT}
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - mongo
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
  client:
    build:
      context: ./client
      args:
        VITE_API_URL:  /api
    depends_on:
      - server
    ports:
      - "80:80"

  mongo:
    image: mongo:7
    container_name: mern_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: